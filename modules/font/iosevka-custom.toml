[buildPlans.IosevkaCustom]
family = "Iosevka Custom"
spacing = "term"
serifs = "slab"
noCvSs = true
exportGlyphNames = true
noLigation = true

[buildPlans.IosevkaCustom.variants]
inherits = "ss04"

[buildPlans.IosevkaCustom.variants.design]
u = "toothed-serifed"

[buildPlans.IosevkaCustom.weights.Regular]
shape = 400
menu = 400
css = 400

[buildPlans.IosevkaCustom.weights.ExtraBold]
shape = 800
menu = 800
css = 800

[buildPlans.IosevkaCustom.widths.Condensed]
shape = 500
menu = 3
css = "condensed"

[buildPlans.IosevkaCustom.widths.Normal]
shape = 600
menu = 5
css = "normal"

[buildPlans.IosevkaCustom.slopes.Upright]
angle = 0
shape = "upright"
menu = "upright"
css = "normal"

[buildPlans.IosevkaCustom.slopes.Oblique]
angle = 9.4
shape = "oblique"
menu = "oblique"
css = "oblique"
